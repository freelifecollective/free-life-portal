name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Install Postgres for the database checks
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
      - name: Database checks
        run: |
          export PGBIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          bash scripts/test-db.sh
      - name: Build
        run: npm run build
